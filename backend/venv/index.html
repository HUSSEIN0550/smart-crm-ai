<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart CRM - نظام الدعم الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- الهيدر الرئيسي -->
        <header class="text-center py-4 border-b border-slate-800">
            <h1 class="text-3xl font-bold text-indigo-400">Smart CRM - نظام الدعم الذكي</h1>
            <p class="text-slate-400 text-sm mt-1">إرسال التذاكر وتحليلها تلقائياً بالذكاء الاصطناعي</p>
        </header>

        <!-- [جديد] كروت الإحصائيات السريعة -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow text-center">
                <p class="text-xs text-slate-400 font-medium">إجمالي التذاكر</p>
                <h4 id="statTotal" class="text-2xl font-bold text-slate-100 mt-1">0</h4>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow text-center">
                <p class="text-xs text-slate-400 font-medium">التذاكر المفتوحة</p>
                <h4 id="statOpen" class="text-2xl font-bold text-indigo-400 mt-1">0</h4>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow text-center">
                <p class="text-xs text-slate-400 font-medium">التذاكر المغلقة</p>
                <h4 id="statClosed" class="text-2xl font-bold text-emerald-400 mt-1">0</h4>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-rose-900/40 bg-rose-950/20 shadow text-center">
                <p class="text-xs text-rose-300 font-medium">حالات عاجلة </p>
                <h4 id="statUrgent" class="text-2xl font-bold text-rose-400 mt-1">0</h4>
            </div>
        </div>

        <!-- نموذج تقديم تذكرة جديدة -->
        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
            <h2 class="text-xl font-semibold mb-4 text-slate-200">تقديم تذكرة جديدة</h2>
            <form id="ticketForm" class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">عنوان المشكلة</label>
                    <input type="text" id="title" required class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="email" required class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">تفاصيل المشكلة (الوصف)</label>
                    <textarea id="description" rows="3" required class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg transition shadow-md">
                    إرسال التذكرة وتحليلها بالذكاء الاصطناعي
                </button>
            </form>
        </section>

        <!-- قائمة التذاكر الحالية -->
        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">
            <h2 class="text-xl font-semibold text-slate-200">التذاكر الحالية وتحليلات النظام</h2>
            <div id="ticketsContainer" class="space-y-4">
                <p class="text-slate-500 text-center">جاري تحميل التذاكر...</p>
            </div>
        </section>

    </div>

    <script src="app.js"></script>
    <!-- عنصر التنبيه الصوتي للتذاكر العاجلة -->
  <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
</body>
</html>
